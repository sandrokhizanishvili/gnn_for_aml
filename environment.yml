# The Python environment of every run (Cineca and elsewhere): Python from conda, every package from pip. PyG 2.8.1 and
# the extension versions of the finished Kaggle runs; torch 2.6.0 + CUDA 12.6 instead of the Kaggle 2.8.0 because the
# extension wheels built for torch >= 2.7 need glibc 2.32 and Leonardo (Red Hat 8) has 2.28. Do not add pyg-lib: its
# wheel needs glibc 2.34 and PyG would sample with it instead of torch-sparse.
#   conda env create -p $WORK/aml_thesis/env -f environment.yml
name: aml_thesis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - --find-links https://data.pyg.org/whl/torch-2.6.0+cu126.html
      - torch==2.6.0+cu126
      - torch-scatter==2.1.2+pt26cu126
      - torch-sparse==0.6.18+pt26cu126
      - torch-cluster==1.6.3+pt26cu126
      - torch-geometric==2.8.1
      - numpy==2.1.3
      - scipy==1.16.3
      - pandas==2.2.3
      - scikit-learn==1.6.1
      - matplotlib==3.10.0
      - psutil==5.9.5
      - lightgbm==4.6.0
      - hydra-core==1.3.2
      - hydra-submitit-launcher==1.2.0
