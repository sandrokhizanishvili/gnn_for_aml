# The Python environment of every run (Cineca and elsewhere): Python from conda, every package from pip, pinned to
# the stack of the finished thesis runs (torch 2.8.0 + CUDA 12.6 wheels, PyG 2.8.1) plus Hydra and its SLURM launcher.
#   conda env create -p $WORK/aml_thesis/env -f environment.yml
name: aml_thesis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - --find-links https://data.pyg.org/whl/torch-2.8.0+cu126.html
      - torch==2.8.0+cu126
      - torch-scatter==2.1.2+pt28cu126
      - torch-sparse==0.6.18+pt28cu126
      - torch-cluster==1.6.3+pt28cu126
      - torch-geometric==2.8.1
      - numpy==2.1.3
      - scipy==1.16.3
      - pandas==2.2.3
      - scikit-learn==1.6.1
      - matplotlib==3.10.0
      - psutil==5.9.5
      - lightgbm==4.6.0
      - hydra-core==1.3.2
      - hydra-submitit-launcher==1.2.0
