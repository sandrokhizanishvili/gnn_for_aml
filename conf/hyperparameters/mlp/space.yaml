# A plain neural net on the same 93 inputs as LightGBM, edge columns standardised on the train rows: the never-searched
# settings and what the search draws. A trial trains 100 epochs unless the pruner stops it; its score is its best
# validation PR-AUC. The winner lives only in recipe.json (mode tune writes it, mode final reads it); there is no
# mode train for this model.
defaults:
  - search@_here_
for: mlp
epochs: 100                  # every trial that is not pruned trains all of them
std_floor: 0.001             # floor of the train std in the standardisation
search:
  first_check: 4             # epochs before the pruner's first check (then 12, 36)
  start:                     # the hand-picked start trial
    hidden: 512
    depth: 3
    shape: funnel
    norm: batch
    dropout: 0.2
    lr: 0.001
    weight_decay: 0.00001
    pos_weight: 8.0
    batch_size: 8192
    activation: relu
  space:                     # a list = choices; [float, low, high] = a range
    hidden: [64, 128, 256, 512]
    depth: [2, 3, 4, 5]
    shape: [flat, funnel, resnet]
    norm: [none, batch, layer]
    dropout: [0.2, 0.3, 0.5, 0.7]
    lr: [0.0005, 0.001, 0.003, 0.005, 0.01]
    weight_decay: [0.0, 0.00001, 0.00005, 0.0005, 0.001, 0.01]
    pos_weight: [float, 1.0, 10.0]
    batch_size: [2048, 8192]
    activation: [relu, prelu, swish]
