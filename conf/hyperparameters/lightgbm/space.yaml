# LightGBM on the 93 inputs (81 edge columns + the 6 + 6 entity one-hots): the never-searched settings and what the
# search draws. A trial trains 1,000 rounds unless the pruner stops it; its score is its best validation PR-AUC. The
# winner lives only in recipe.json (mode tune writes it, mode final reads it); there is no mode train for this model.
defaults:
  - search@_here_
for: lightgbm
settings:                    # never searched
  objective: binary
  bagging_freq: 1
  verbose: -1
rounds: 1000                 # every trial that is not pruned trains all of them (the upper bound of Altman et al. 2023)
check_every: 25              # final: rounds between the train / val scores of history.csv
search:
  first_check: 40            # rounds before the pruner's first check (then 120, 360)
  report_every: 20           # rounds between two reports to the pruner
  space:                     # [int | float | log, low, high] = a range
    num_leaves: [int, 7, 63]
    learning_rate: [log, 0.01, 0.05]
    min_data_in_leaf: [int, 200, 2000]
    feature_fraction: [float, 0.3, 0.8]
    bagging_fraction: [float, 0.5, 1.0]
    lambda_l1: [log, 0.01, 10.0]
    lambda_l2: [log, 1.0, 100.0]
    scale_pos_weight: [float, 1.0, 10.0]
