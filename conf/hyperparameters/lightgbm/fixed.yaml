# LightGBM on the 93 inputs (81 edge columns + the 6 + 6 entity one-hots). point = the frozen winner of the thesis
# search (trial 84), so mode train reproduces the thesis runs without re-running the search.
for: lightgbm
settings:                    # never searched
  objective: binary
  bagging_freq: 1
  verbose: -1
early_stopping: 100          # rounds without a higher validation PR-AUC; the kept round is the best one
check_every: 25              # rounds between the train / val scores of history.csv
point:
  num_round: 2000
  num_leaves: 25
  learning_rate: 0.010407600769327152
  min_data_in_leaf: 545
  feature_fraction: 0.7637302292520134
  bagging_fraction: 0.7241036641284357
  lambda_l1: 0.08367682964780478
  lambda_l2: 15.738175470908685
  scale_pos_weight: 1.0658301066371407
