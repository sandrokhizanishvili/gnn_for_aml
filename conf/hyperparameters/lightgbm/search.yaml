# The halving search of the thesis (Altman et al. 2023 Appendix C): 100 configurations, the best half kept each round,
# first round on the most recent 10 % of the train rows, ranked by validation PR-AUC. Modes tune and final.
defaults:
  - lightgbm/fixed@_here_
search:
  n_configs: 100
  eta: 2
  first_fraction: 0.1
  select: val_pr_auc
  draw_seed: 42
  space:                     # [kind, low, high]; kind int | float | log. num_round is fixed but stays in the draw order.
    num_round: [int, 2000, 2000]
    num_leaves: [int, 7, 63]
    learning_rate: [log, 0.01, 0.05]
    min_data_in_leaf: [int, 200, 2000]
    feature_fraction: [float, 0.3, 0.8]
    bagging_fraction: [float, 0.5, 1.0]
    lambda_l1: [log, 0.01, 10.0]
    lambda_l2: [log, 1.0, 100.0]
    scale_pos_weight: [float, 1.0, 10.0]
