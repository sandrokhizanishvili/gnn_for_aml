# @package _global_
# The GNN search: one study per (operator, configs 2 / 4), 4 workers each = 32 jobs. A worker runs trials until its
# study has n_trials; then "python aggregate.py". Must match models and feature_configs of hyperparameters/gnn/space.yaml.
defaults:
  - override /hyperparameters: gnn/space
mode: tune
hydra:
  sweeper:
    params:
      model: gin,pna,gat,transformer
      feature_config: c2,c4
      worker: 0,1,2,3
